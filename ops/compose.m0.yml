# Lorefold M0 "Resurrect" — pinned published images, zero compilation.
#
# This file is deliberately separate from the repo-root docker-compose.yml, which
# is upstream Athens' dev/release file and is left untouched.
#
# Run from the repository root:
#   cp ops/.env.example ops/.env && $EDITOR ops/.env   # set a real ATHENS_PASSWORD
#   docker compose -f ops/compose.m0.yml up -d
#
# Compose reads ops/.env automatically: with `-f ops/compose.m0.yml` the project
# directory is ops/, so ops/.env is the env file. ops/.env is gitignored.
#
# See ops/RUNBOOK.md for the full boot, connect, smoke-test and backup procedure.

name: lorefold-m0

services:
  athens:
    # PINNED. Never :latest — an unpinned tag silently changes the running
    # server, and there is no compiled-from-source build in M0 to fall back to.
    image: ghcr.io/athensresearch/athens:v2.1.0-beta.5
    restart: always
    depends_on:
      fluree:
        condition: service_healthy
    ports:
      # Publishing on 0.0.0.0 by default so a second machine on the LAN can
      # reach the graph (the two-browser presence check in ops/RUNBOOK.md).
      # Auth is ONE shared password with no accounts and no per-page
      # permissions: anything that can reach this port can read and write the
      # whole graph. Set ATHENS_BIND_ADDR=127.0.0.1 in ops/.env for a
      # local-only stack.
      - "${ATHENS_BIND_ADDR:-0.0.0.0}:3010:3010"
    volumes:
      - ../athens-data/logs:/srv/athens/logs
      - ../athens-data/datascript:/srv/athens/datascript
    environment:
      # ---------------------------------------------------------------------
      # EDN-in-YAML quoting trap
      # ---------------------------------------------------------------------
      # The server parses this value as EDN, where string values MUST be
      # wrapped in double quotes. YAML would eat those double quotes if the
      # scalar were double-quoted or unquoted, and the server would then fail
      # to read the password. The SINGLE quotes below are what make the inner
      # double quotes survive into the container.
      #
      # Verify after any edit — the printed value must still show the inner
      # double quotes around the password:
      #   docker compose -f ops/compose.m0.yml config | grep CONFIG_EDN
      #
      # CONFIG_EDN is deep-merged into src/clj/config.default.edn, so only the
      # keys that differ from the defaults belong here.
      #
      # NEVER add :nrepl — it starts an unauthenticated remote REPL, which is
      # arbitrary code execution on any host that can reach it.
      # NEVER set :in-memory? true — it silently disables all durability.
      CONFIG_EDN: '${CONFIG_EDN:-{:password "${ATHENS_PASSWORD:-CHANGE-ME}" :feature-flags {:api true}}}'
      # Daily-note titles and the REST API's "@today" are resolved from the
      # container clock. Without TZ the container runs UTC and the daily page
      # rolls over at the wrong local hour, silently creating notes on the
      # wrong day.
      TZ: ${TZ:-America/New_York}
    healthcheck:
      test: curl -f localhost:3010/health-check
      interval: 15s
      timeout: 60s
      retries: 10
      start_period: 15s

  fluree:
    # PINNED. Under default settings the maximum recommended event size is 2mb;
    # it can be raised to ~10mb via fdb-memory-reindex-max.
    image: fluree/ledger:1.0.0-beta17
    restart: always
    # NO `ports:` SECTION — DO NOT ADD ONE.
    # Fluree has no authentication of any kind. It is reachable only over the
    # compose network, as http://fluree:8090, by the athens service. Publishing
    # 8090 to the host hands the entire event log to anyone who can reach it.
    # To inspect it during debugging use an ephemeral port-forward instead:
    #   docker compose -f ops/compose.m0.yml exec fluree ...
    volumes:
      - ../athens-data/fluree:/var/lib/fluree
    environment:
      TZ: ${TZ:-America/New_York}
    healthcheck:
      # NB: this check works because 1.0.0-beta17 still ships curl. Later
      # fluree images moved to a smaller base image without curl, so bumping
      # this tag requires replacing the health check too.
      test: curl -f localhost:8090/fdb/health
      interval: 15s
      timeout: 30s
      retries: 3
      start_period: 15s
